<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yoga AI - カメラテスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>🧘 Yoga AI</h1>
    <p class="subtitle">まずはウェブカメラを起動します</p>

    <div class="camera">
      <video id="video" autoplay playsinline muted></video>
      <div id="placeholder">📷<br><span>「カメラを開始」を押してください</span></div>
    </div>

    <div class="buttons">
      <button id="start">カメラを開始</button>
      <button id="stop" disabled>停止</button>
    </div>

    <p id="status">準備完了</p>
    <p class="note">映像はこのブラウザ内で表示されます。</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
